apiVersion: apps/v1
kind: Deployment
metadata:
  name: meraki-cache-api-dev
  namespace: intuit-dev
  labels:
    app: meraki-cache-api-dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: meraki-cache-api-dev
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        vault.hashicorp.com/ca-cert: /run/secrets/kubernetes.io/serviceaccount/ca.crt
        vault.hashicorp.com/role: 'meraki-cache-api-dev'
        vault.hashicorp.com/agent-inject-secret-meraki-cache-api-dev: 'dev/meraki-cache-api'
        vault.hashicorp.com/agent-inject-template-meraki-cache-api-dev: |
          {{- with secret "dev/meraki-cache-api" -}}
            export MERAKI_API_KEY="{{ .Data.data.meraki_api_key }}"
          {{- end }}
      labels:
        app: meraki-cache-api-dev
    spec:
      serviceAccountName: meraki-cache-api-dev
      securityContext:
        runAsNonRoot: true
        runAsUser: 10014
        runAsGroup: 10015
        fsGroup: 10015
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meraki-cache-api-dev
          image: harbor.pscp-css.support/library/meraki-cache-api:1.0.0-dev
          imagePullPolicy: Always
          command: ["sh", "-c", "source /vault/secrets/meraki-cache-api-dev && python -m uvicorn src.api:app --host 0.0.0.0 --port 8080"]
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
